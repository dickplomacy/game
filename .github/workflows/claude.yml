name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: ${{ contains(github.event.comment.body, '@claude') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          prompt: ${{ github.event.comment.body }}
          show_full_output: true
          display_report: true
          track_progress: true
          # Use Claude Sonnet 4.6 (Feb 2026 release)
          claude_args: "--model claude-sonnet-4-6 --allowed-tools Glob,Grep,LS,Read,Bash,Bash(npm:*),Bash(npx:*),Bash(vitest:*)"