name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: ${{ contains(github.event.comment.body, '@claude') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # Export as env var
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}  # Also pass as input
          prompt: ${{ github.event.comment.body }}
          show_full_output: true   # ✅ Shows Claude's full reasoning in logs
          display_report: true     # ✅ Posts summary comment on issue/PR
          track_progress: true     # ✅ Updates progress comments