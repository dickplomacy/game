name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write  # Add this line for OIDC token fetching

jobs:
  claude:
    if: ${{ contains(github.event.comment.body, '@claude') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}  # Changed from CLAUDE_API_KEY
          prompt: ${{ github.event.comment.body }}
