# .github/workflows/deepseek-bot.yml
name: DeepSeek Coding Assistant

on:
  issue_comment:
    types:
      - created
  pull_request_review_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  respond:
    if: contains(github.event.comment.body, '@deepseek') || contains(github.event.review.body, '@deepseek')
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.api_call.outputs.success }}
      branch_name: ${{ steps.create_branch.outputs.branch_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Call DeepSeek API
        id: api_call
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -e
          RESPONSE=$(curl -sS -X POST https://api.deepseek.com/v1/chat/completions \
            -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"deepseek-v4-pro\",\"messages\":[{\"role\":\"system\",\"content\":\"Expert coding assistant. Match Claude Sonnet 4.6 quality.\"},{\"role\":\"user\",\"content\":\"${{ github.event.comment.body }}\"}],\"temperature\":0.2,\"max_tokens\":8000}")
          
          CONTENT=$(echo "${RESPONSE}" | jq -r '.choices[0].message.content')
          
          if [ ${#CONTENT} -gt 100 ]; then
            echo "${CONTENT}" > /tmp/response.txt
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "::error::Invalid response from API"
            exit 1
          fi

      - name: Post Response Comment
        if: steps.api_call.outputs.success == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body-file /tmp/response.txt

      - name: Create Branch
        if: steps.api_call.outputs.success == 'true'
        id: create_branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="deepseek-fix-${{ github.event.issue.number }}-$(date +%s)"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
        
          git config user.email "bot@deepseek.actions"
          git config user.name "DeepSeek Bot"
          git checkout -b "${BRANCH_NAME}"

      - name: Apply Code Fixes
        if: steps.api_call.outputs.success == 'true'
        id: apply_fixes
        run: |
          python3 /workspace/apply_fixes.py
          
          if [ -s /tmp/changed_files.txt ]; then
            while IFS= read -r FILE; do
              if [ -n "${FILE}" ]; then
                git add "${FILE}"
              fi
            done < /tmp/changed_files.txt
            
            if ! git diff --cached --quiet; then
              git commit -m "[DeepSeek] Auto-fix for issue #${{ github.event.issue.number }}"
              git push -u origin "${{ steps.create_branch.outputs.branch_name }}"
              echo "changes_applied=true" >> $GITHUB_OUTPUT
            else
              echo "changes_applied=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "changes_applied=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.apply_fixes.outputs.changes_applied == 'true'
        id: create_pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --title "[DeepSeek] Fix for #${{ github.event.issue.number }}" \
            --body "Auto-generated fix by @deepseek bot." \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${{ steps.create_branch.outputs.branch_name }}")
          
          echo "pr_url=${PR_URL}" >> $GITHUB_OUTPUT

      - name: Post PR Link
        if: steps.create_pr.outputs.pr_url != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "✨ PR created: ${{ steps.create_pr.outputs.pr_url }}"

      - name: Upload Scripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scripts
          path: /workspace/
