# .github/workflows/deepseek-bot.yml
name: DeepSeek Coding Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  respond:
    if: contains(github.event.comment.body, '@deepseek') || contains(github.event.review.body, '@deepseek')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Extract Issue Data
        id: extract_data
        run: |
          echo "item_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          echo "item_title=${{ github.event.issue.title }}" >> $GITHUB_OUTPUT
          echo "repo=${{ github.repository }}" >> $GITHUB_OUTPUT

      - name: Call DeepSeek API
        id: api_call
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          RESPONSE=$(curl -sS \
            -X POST https://api.deepseek.com/v1/chat/completions \
            -H "Authorization: Bearer $DEEPSEEK_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"deepseek-v4-pro\",\"messages\":[{\"role\":\"system\",\"content\":\"Expert coding assistant. Match Claude Sonnet 4.6 quality.\"},{\"role\":\"user\",\"content\":\"${{ github.event.comment.body }}\"}],\"temperature\":0.2,\"max_tokens\":8000}")
          
          CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          
          if [ ${#CONTENT} -gt 100 ]; then
            echo "$CONTENT" > /tmp/response.txt
            echo "success=true" >> $GITHUB_OUTPUT
            echo "tokens=$(echo "$RESPONSE" | jq -r '.usage.total_tokens // 0')" >> $GITHUB_OUTPUT
          else
            echo "::error::Invalid response"
            exit 1
          fi

      - name: Post Comment
        if: steps.api_call.outputs.success == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body-file /tmp/response.txt

      - name: Parse and Apply Fixes
        id: apply_fixes
        if: steps.api_call.outputs.success == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="deepseek-fix-${{ github.event.issue.number }}-$(date +%s)"
          python3 -c "
import re, os
response = open('/tmp/response.txt').read()
pattern = r'\`\`\`\w*\s*(\S+\.[a-z]+)\n(.*?)\`\`\`'
files = re.findall(pattern, response, re.DOTALL)
valid = [(f,c) for f,c in files if '/' in f and len(f)>5]
open('/tmp/changes.txt','w').write('\n'.join([f for f,_ in valid]))
print(len(valid))
"
          
          if [ -s /tmp/changes.txt ]; then
            echo "auto_apply=true" >> $GITHUB_OUTPUT
            
            git config user.email "bot@actions.github.com"
            git config user.name "DeepSeek Bot"
            git checkout -b "$BRANCH"
            
            python3 -c "
import re, os
response = open('/tmp/response.txt').read()
pattern = r'\`\`\`\w*\s*(\S+\.[a-z]+)\n(.*?)\`\`\`'
for filepath, content in re.findall(pattern, response, re.DOTALL):
    if '/' in filepath and len(filepath)>5:
        try:
            os.makedirs(os.path.dirname(filepath), exist_ok=True)
            open(filepath,'w').write(content)
            os.system(f'git add \"{filepath}\"')
        except: pass
"
            
            if git diff --cached --quiet; then
              echo "no_changes=true" >> $GITHUB_OUTPUT
            else
              git commit -m "Auto-fix from @deepseek"
              git push -u origin "$BRANCH"
              echo "branch_name=$BRANCH" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Create PR
        if: steps.apply_fixes.outputs.auto_apply == 'true' && steps.apply_fixes.outputs.no_changes != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr create \
            --title "[DeepSeek] Fix #${{ github.event.issue.number }}" \
            --body "Auto-generated by @deepseek bot" \
            --base ${{ github.event.repository.default_branch }} \
            --head ${{ steps.apply_fixes.outputs.branch_name }})
          echo "pr_url=$PR" >> $GITHUB_OUTPUT

      - name: Final Comment
        if: steps.create_pr.outputs.pr_url != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "✨ PR created: ${{ steps.create_pr.outputs.pr_url }}"
