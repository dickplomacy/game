name: DeepSeek Bot - Premium Edition

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

env:
  REPO_NAME: ${{ github.repository }}
  ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
  EVENT_TYPE: ${{ github.event_name }}
  BOT_EMAIL: bot@deepseek.ai
  BOT_NAME: DeepSeek Bot

jobs:
  respond:
    if: contains(github.event.comment.body, '@deepseek') || contains(github.event.review.body, '@deepseek')
    runs-on: ubuntu-latest

    steps:
      # ==========================================================================
      # PHASE 0: SETUP & VALIDATION
      # ==========================================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
          lfs: false
          submodules: false

      - name: Validate Request
        id: validate
        run: |
          COMMENT="${{ github.event.comment.body }}"

          # Skip if comment is too short
          WORD_COUNT=$(echo "${COMMENT}" | wc -w)
          if [ "${WORD_COUNT}" -lt 3 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Comment too short, skipping"
            exit 0
          fi

          # Skip if just mentions without content
          CLEAN_COMMENT=$(echo "${COMMENT}" | sed 's/@[a-zA-Z0-9_-]*//g' | xargs)
          if [ -z "${CLEAN_COMMENT}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::No meaningful content, skipping"
            exit 0
          fi

          # Determine event type
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "event_type=issue" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            echo "event_type=pr_review" >> $GITHUB_OUTPUT
          else
            echo "event_type=other" >> $GITHUB_OUTPUT
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
          echo "comment_length=${#COMMENT}" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        if: steps.validate.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ripgrep \
            tree \
            jq \
            curl \
            grep \
            coreutils

          echo "Dependencies installed"

      # ==========================================================================
      # PHASE 1: CONTEXT COLLECTION
      # ==========================================================================

      - name: Collect Code Context
        if: steps.validate.outputs.skip != 'true'
        id: context
        run: |
          set -euo pipefail

          CONTEXT_FILE="/tmp/code_context.txt"
          DEBUG_FILE="/tmp/debug.log"
          METRICS_FILE="/tmp/context_metrics.json"

          : > "${CONTEXT_FILE}"
          : > "${DEBUG_FILE}"

          echo "Starting context collection..." >> "${DEBUG_FILE}"
          echo "Comment: ${{ github.event.comment.body }}" >> "${DEBUG_FILE}"

          # STEP 1: Explicit file paths from comment
          echo "=== Phase 1: Extracting explicit file paths ===" >> "${DEBUG_FILE}"

          COMMENT_BODY="${{ github.event.comment.body }}"
          echo "${COMMENT_BODY}" | grep -oE '[a-zA-Z0-9_./\-]+\.(js|ts|jsx|tsx|py|go|java|rb|php|c|cpp|h|rs|vue|svelte|mjs|cjs)' 2>/dev/null | head -20 | while read -r FILEPATH; do
            FOUND=$(rg --files 2>/dev/null | grep -F "${FILEPATH}" | head -1 || true)
            if [ -n "${FOUND}" ] && [ -f "${FOUND}" ]; then
              echo "Found explicit file: ${FOUND}" >> "${DEBUG_FILE}"
              echo "--- FILE: ${FOUND} ---" >> "${CONTEXT_FILE}"
              cat "${FOUND}" >> "${CONTEXT_FILE}" 2>/dev/null || true
              echo "--- END FILE: ${FOUND} ---" >> "${CONTEXT_FILE}"
              echo "" >> "${CONTEXT_FILE}"
            fi
          done || true

          # STEP 2: Recently modified files
          echo "=== Phase 2: Checking recent changes ===" >> "${DEBUG_FILE}"

          git log --name-only --pretty=format: -n 10 2>/dev/null | \
            grep -E '\.(js|ts|py|go|java)$' | sort -u | head -15 | while read -r FILEPATH; do
            if [ -f "${FILEPATH}" ]; then
              if ! grep -q "^--- FILE: ${FILEPATH} ---$" "${CONTEXT_FILE}" 2>/dev/null; then
                echo "Adding recently modified: ${FILEPATH}" >> "${DEBUG_FILE}"
                echo "--- FILE: ${FILEPATH} (recently modified) ---" >> "${CONTEXT_FILE}"
                cat "${FILEPATH}" >> "${CONTEXT_FILE}" 2>/dev/null || true
                echo "--- END FILE: ${FILEPATH} ---" >> "${CONTEXT_FILE}"
                echo "" >> "${CONTEXT_FILE}"
              fi
            fi
          done || true

          # STEP 3: Project config files
          echo "=== Phase 3: Adding project configs ===" >> "${DEBUG_FILE}"

          for CFG in package.json tsconfig.json requirements.txt go.mod Cargo.toml pyproject.toml Makefile; do
            if [ -f "${CFG}" ]; then
              echo "--- CONFIG: ${CFG} ---" >> "${CONTEXT_FILE}"
              cat "${CFG}" >> "${CONTEXT_FILE}"
              echo "--- END CONFIG: ${CFG} ---" >> "${CONTEXT_FILE}"
              echo "" >> "${CONTEXT_FILE}"
            fi
          done

          # STEP 4: Commit history summary
          echo "=== Phase 4: Adding commit history ===" >> "${DEBUG_FILE}"
          echo "--- COMMIT HISTORY (Last 20) ---" >> "${CONTEXT_FILE}"
          git log --oneline -20 >> "${CONTEXT_FILE}" 2>/dev/null || true
          echo "--- END COMMIT HISTORY ---" >> "${CONTEXT_FILE}"
          echo "" >> "${CONTEXT_FILE}"

          # STEP 5: Keyword-based discovery
          echo "=== Phase 5: Keyword-based file discovery ===" >> "${DEBUG_FILE}"

          KEYWORDS=$(echo "${COMMENT_BODY}" | \
            tr '[:upper:]' '[:lower:]' | \
            sed 's/@[a-zA-Z0-9_-]*//g' | \
            sed 's/[^a-z0-9]/ /g' | \
            tr -s ' ' | \
            grep -oE '\b[a-z]{5,}\b' | sort -u | head -8) || true

          echo "Keywords: ${KEYWORDS}" >> "${DEBUG_FILE}"

          for KW in ${KEYWORDS}; do
            rg -l "${KW}" --type js --type ts --type py --type go --type java \
              --glob '!.git/*' --glob '!node_modules/*' --glob '!vendor/*' 2>/dev/null | \
              head -5 | while read -r FILE; do
              if [ -f "${FILE}" ]; then
                if ! grep -q "^--- FILE: ${FILE} ---$" "${CONTEXT_FILE}" 2>/dev/null; then
                  FILE_SIZE=$(wc -c < "${FILE}" 2>/dev/null || echo "0")
                  echo "--- FILE: ${FILE} (keyword: ${KW}, size: ${FILE_SIZE}) ---" >> "${CONTEXT_FILE}"
                  if [ "${FILE_SIZE}" -lt 100000 ]; then
                    cat "${FILE}" >> "${CONTEXT_FILE}" 2>/dev/null || true
                  else
                    head -500 "${FILE}" >> "${CONTEXT_FILE}" 2>/dev/null || true
                    echo "// ... [file truncated]" >> "${CONTEXT_FILE}"
                  fi
                  echo "--- END FILE: ${FILE} ---" >> "${CONTEXT_FILE}"
                  echo "" >> "${CONTEXT_FILE}"
                fi
              fi
            done || true
          done

          # Calculate metrics
          CONTEXT_BYTES=$(wc -c < "${CONTEXT_FILE}" 2>/dev/null || echo "0")
          TOTAL_LINES=$(wc -l < "${CONTEXT_FILE}" 2>/dev/null || echo "0")

          echo "=== Collection Complete ===" >> "${DEBUG_FILE}"
          echo "Bytes: ${CONTEXT_BYTES}" >> "${DEBUG_FILE}"
          echo "Lines: ${TOTAL_LINES}" >> "${DEBUG_FILE}"

          # Output as JSON
          echo "{\"bytes\": ${CONTEXT_BYTES}, \"lines\": ${TOTAL_LINES}}" > "${METRICS_FILE}"

          echo "bytes=${CONTEXT_BYTES}" >> $GITHUB_OUTPUT
          echo "metrics_path=${METRICS_FILE}" >> $GITHUB_OUTPUT

      # ==========================================================================
      # PHASE 2: BUILD PROMPTS
      # ==========================================================================

      - name: Save User Request
        if: steps.validate.outputs.skip != 'true'
        run: |
          cat > /tmp/user_request.txt << 'EOF'
          {{REQUEST}}
          EOF

          # Replace placeholder safely
          sed -i "s|{{REQUEST}}|$(cat /tmp/user_request.txt | head -1)|g" /tmp/user_request.txt 2>/dev/null || true
          
          echo "${{ github.event.comment.body }}" > /tmp/original_request.txt

      - name: Build Analysis Prompt
        if: steps.validate.outputs.skip != 'true'
        id: build_analysis
        run: |
          # Read files safely
          CODE_CONTEXT=""
          if [ -f /tmp/code_context.txt ]; then
            CODE_CONTEXT=$(cat /tmp/code_context.txt)
          fi

          REQUEST_TEXT=""
          if [ -f /tmp/original_request.txt ]; then
            REQUEST_TEXT=$(cat /tmp/original_request.txt)
          fi

          # Write prompt with escaped content
          cat > /tmp/analysis_prompt.txt << PROMPT_END
          You are a Principal Software Engineer with 15+ years of experience.
          
          ================================================================
          ANALYSIS MODE: Understand the problem deeply before solving
          ================================================================
          
          ## REQUIRED OUTPUT STRUCTURE
          
          ### 1. PROBLEM SUMMARY
          ### 2. ROOT CAUSE ANALYSIS  
          ### 3. IMPACT ASSESSMENT
          ### 4. PROPOSED APPROACH
          ### 5. ALTERNATIVES CONSIDERED
          
          ## CRITICAL GUIDELINES
          - Think step-by-step
          - Reference specific files and lines
          - If information is missing, state what you need
          
          ================================================================
          REPOSITORY CONTEXT
          ================================================================
          
          Repository: ${REPO_NAME}
          Issue Number: ${ISSUE_NUMBER}
          
          USER REQUEST:
          ${REQUEST_TEXT}
          
          ================================================================
          CODEBASE CONTEXT
          ================================================================
          
          ${CODE_CONTEXT}
          
          ================================================================
          Begin your analysis now.
          ================================================================
          PROMPT_END

          echo "Analysis prompt built ($(wc -c < /tmp/analysis_prompt.txt) bytes)"

      - name: Build Implementation Prompt
        if: steps.validate.outputs.skip != 'true'
        id: build_impl
        run: |
          ANALYSIS_TEXT=""
          if [ -f /tmp/analysis_response.txt ]; then
            ANALYSIS_TEXT=$(cat /tmp/analysis_response.txt)
          fi

          REQUEST_TEXT=""
          if [ -f /tmp/original_request.txt ]; then
            REQUEST_TEXT=$(cat /tmp/original_request.txt)
          fi

          cat > /tmp/impl_prompt.txt << PROMPT_END
          You are a Senior Software Engineer implementing fixes.
          
          ================================================================
          IMPLEMENTATION MODE: Generate production-quality code
          ================================================================
          
          ANALYSIS FROM PREVIOUS STEP:
          ${ANALYSIS_TEXT}
          
          ## OUTPUT FORMAT FOR EACH FILE
          
          \`\`\`<language> <relative/path/to/file.ext>
          // CHANGE: <Brief description>
          // REASON: <Why this change>
          // ORIGINAL (line ~XX): <Previous code snippet>
          
          // FULL UPDATED FILE CONTENT:
          <complete file>
          \`\`\`
          
          ## CRITICAL RULES
          1. ALWAYS provide COMPLETE files, not diffs
          2. Include ALL imports/dependencies
          3. Preserve existing code style
          4. Add error handling
          5. NEVER truncate unless necessary
          
          ## FINAL SECTIONS REQUIRED
          
          ## CHANGED FILES
          - <file1>: <changes>
          
          ## RECOMMENDED NEXT STEPS
          - Tests to add
          - Documentation updates
          
          ================================================================
          USER REQUEST: ${REQUEST_TEXT}
          ================================================================
          Begin implementation now.
          ================================================================
          PROMPT_END

          echo "Implementation prompt built ($(wc -c < /tmp/impl_prompt.txt) bytes)"

      # ==========================================================================
      # PHASE 3: API CALLS
      # ==========================================================================

      - name: Run Analysis Phase
        if: steps.validate.outputs.skip != 'true'
        id: analysis
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          REQUEST_FILE="/tmp/analysis_request.json"
          PROMPT_CONTENT=$(cat /tmp/analysis_prompt.txt)

          # Escape JSON properly
          ESCAPED_PROMPT=$(printf '%s' "${PROMPT_CONTENT}" | jq -Rs '.')

          jq -n \
            --argjson prompt "${ESCAPED_PROMPT}" \
            '{
              model: "deepseek-chat",
              messages: [
                {
                  role: "system",
                  content: "You are a Principal Software Engineer. Analyze problems thoroughly before proposing solutions. Think step-by-step."
                },
                {
                  role: "user",
                  content: $prompt
                }
              ],
              temperature: 0.15,
              top_p: 0.9,
              max_tokens: 16000
            }' > "${REQUEST_FILE}"

          MAX_ATTEMPTS=3
          SUCCESS=false

          for i in 1 2 3; do
            echo "Analysis attempt ${i}/${MAX_ATTEMPTS}..."

            HTTP_CODE=$(curl -sS -w "%{http_code}" \
              -X POST https://api.deepseek.com/v1/chat/completions \
              -H "Authorization: Bearer ${DEEPSEEK_KEY}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d @"${REQUEST_FILE}" \
              -o /tmp/analysis_response.txt 2>/dev/null) || true

            if [ "${HTTP_CODE}" = "200" ]; then
              CONTENT_LENGTH=$(jq -r '.choices[0].message.content | length' /tmp/analysis_response.txt 2>/dev/null || echo "0")
              if [ "${CONTENT_LENGTH}" -gt 100 ]; then
                echo "Analysis succeeded (${CONTENT_LENGTH} chars)"
                echo "status=success" >> $GITHUB_OUTPUT
                echo "content_length=${CONTENT_LENGTH}" >> $GITHUB_OUTPUT
                SUCCESS=true
                break
              fi
            fi

            ERROR_MSG=$(jq -r '.error.message // "Unknown error"' /tmp/analysis_response.txt 2>/dev/null) || true
            echo "Attempt ${i} failed: HTTP ${HTTP_CODE} - ${ERROR_MSG}"

            if [ "${i}" -lt "${MAX_ATTEMPTS}" ]; then
              sleep $((i * 2))
            fi
          done

          if [ "${SUCCESS}" != "true" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "error=Analysis failed after ${MAX_ATTEMPTS} attempts" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Run Implementation Phase
        if: steps.validate.outputs.skip != 'true' && steps.analysis.outputs.status == 'success'
        id: implementation
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          REQUEST_FILE="/tmp/impl_request.json"
          PROMPT_CONTENT=$(cat /tmp/impl_prompt.txt)

          ESCAPED_PROMPT=$(printf '%s' "${PROMPT_CONTENT}" | jq -Rs '.')

          jq -n \
            --argjson prompt "${ESCAPED_PROMPT}" \
            '{
              model: "deepseek-chat",
              messages: [
                {
                  role: "system",
                  content: "You are a Senior Software Engineer. Generate complete production-ready code files. Follow output format exactly."
                },
                {
                  role: "user",
                  content: $prompt
                }
              ],
              temperature: 0.1,
              top_p: 0.95,
              frequency_penalty: 0.1,
              presence_penalty: 0.1,
              max_tokens: 24000
            }' > "${REQUEST_FILE}"

          MAX_ATTEMPTS=3
          SUCCESS=false

          for i in 1 2 3; do
            echo "Implementation attempt ${i}/${MAX_ATTEMPTS}..."

            HTTP_CODE=$(curl -sS -w "%{http_code}" \
              -X POST https://api.deepseek.com/v1/chat/completions \
              -H "Authorization: Bearer ${DEEPSEEK_KEY}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d @"${REQUEST_FILE}" \
              -o /tmp/impl_response.txt 2>/dev/null) || true

            if [ "${HTTP_CODE}" = "200" ]; then
              CONTENT_LENGTH=$(jq -r '.choices[0].message.content | length' /tmp/impl_response.txt 2>/dev/null || echo "0")
              if [ "${CONTENT_LENGTH}" -gt 100 ]; then
                echo "Implementation succeeded (${CONTENT_LENGTH} chars)"
                echo "status=success" >> $GITHUB_OUTPUT
                echo "content_length=${CONTENT_LENGTH}" >> $GITHUB_OUTPUT
                SUCCESS=true
                break
              fi
            fi

            ERROR_MSG=$(jq -r '.error.message // "Unknown error"' /tmp/impl_response.txt 2>/dev/null) || true
            echo "Attempt ${i} failed: HTTP ${HTTP_CODE} - ${ERROR_MSG}"

            if [ "${i}" -lt "${MAX_ATTEMPTS}" ]; then
              sleep $((i * 2))
            fi
          done

          if [ "${SUCCESS}" != "true" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

      # ==========================================================================
      # PHASE 4: POST & APPLY FIXES
      # ==========================================================================

      - name: Extract and Apply Code Blocks
        if: steps.validate.outputs.skip != 'true' && steps.implementation.outputs.status == 'success'
        id: apply_fixes
        run: |
          : > /tmp/files_to_commit.txt

          awk '
          BEGIN { in_block = 0; block_num = 0; current_file = "" }

          /^```[a-zA-Z]*[[:space:]]/ {
            if (in_block) {
              if (current_file != "" && current_file != "/dev/null") {
                close(current_file)
              }
              in_block = 0
              current_file = ""
              next
            }

            line = $0
            gsub(/^```[a-zA-Z]*[[:space:]]*/, "", line)
            gsub(/[[:space:]].*$/, "", line)
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)

            block_num++
            print "Block " block_num ": \"" line "\""

            if (match(line, /^[a-zA-Z0-9_\-\.\/]+\.[a-zA-Z]+$/) && index(line, ".") > 1) {
              gsub(/^\.\//, "", line)
              current_file = line

              dir_cmd = "mkdir -p $(dirname \"" line "\")"
              system(dir_cmd)

              print "Writing to: " current_file
              print current_file >> "/tmp/files_to_commit.txt"
            } else {
              print "Skipped: " line
              current_file = "/dev/null"
            }
            in_block = 1
            next
          }

          in_block && current_file != "" && current_file != "/dev/null" {
            if ($0 !~ /^(CHANGE:|REASON:|ORIGINAL:|\/\/\s+\*\*)/) {
              print >> current_file
            }
          }

          END {
            print "Total blocks: " block_num
            print "Files to commit: " NR_files
          }
          ' /tmp/implementation_response.txt 2>&1 || true

          if [ -s /tmp/files_to_commit.txt ]; then
            FILE_COUNT=$(wc -l < /tmp/files_to_commit.txt)
            echo "file_count=${FILE_COUNT}" >> $GITHUB_OUTPUT

            echo "Files extracted:"
            cat /tmp/files_to_commit.txt

            while IFS= read -r FILE; do
              if [ -n "${FILE}" ] && [ -f "${FILE}" ]; then
                echo "Adding: ${FILE}"
                git add "${FILE}"
              else
                echo "Warning: File not found: ${FILE}"
              fi
            done < /tmp/files_to_commit.txt

            if ! git diff --cached --quiet; then
              git config user.email "${BOT_EMAIL}"
              git config user.name "${BOT_NAME}"
              git commit -m "[DeepSeek] Fix #${{ github.event.issue.number }}"
              git push -u origin HEAD
              echo "applied=true" >> $GITHUB_OUTPUT
              echo "Changes committed successfully"
            else
              echo "No changes to commit"
            fi
          else
            echo "No valid code blocks extracted"
            echo "file_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Post Response to Issue
        if: steps.validate.outputs.skip != 'true' && steps.implementation.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body-file /tmp/impl_response.txt

      - name: Create Pull Request
        if: steps.apply_fixes.outputs.applied == 'true'
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_BRANCH=$(git symbolic-ref refs/remotes/origin/HEAD | sed 's@^refs/remotes/origin/@@')
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)

          PR_URL=$(gh pr create \
            --title "[DeepSeek] Fix #${{ github.event.issue.number }}" \
            --body "Automated fix for issue #${{ github.event.issue.number }}. Review carefully before merging." \
            --base "${BASE_BRANCH}" \
            --head "${BRANCH_NAME}")

          echo "url=${PR_URL}" >> $GITHUB_OUTPUT

          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "✨ PR created: ${PR_URL}"

      # ==========================================================================
      # PHASE 5: DEBUG ARTIFACTS
      # ==========================================================================

      - name: Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: |
            /tmp/debug.log
            /tmp/context_metrics.json
            /tmp/analysis_response.txt
            /tmp/impl_response.txt
            /tmp/files_to_commit.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Log Final Status
        if: always()
        run: |
          echo "=== WORKFLOW STATUS ==="
          echo "Job: ${{ job.status }}"
          echo "Issue: #${{ github.event.issue.number }}"

          if [ -f /tmp/analysis_response.txt ]; then
            echo "Analysis: Success"
          else
            echo "Analysis: Skipped or Failed"
          fi

          if [ -f /tmp/impl_response.txt ]; then
            echo "Implementation: Success"
          else
            echo "Implementation: Skipped or Failed"
          fi
