name: DeepSeek Bot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  respond:
    if: contains(github.event.comment.body, '@deepseek') || contains(github.event.review.body, '@deepseek')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq tree

      - name: Show Repo Structure
        run: |
          echo "=== Repository Files ==="
          find . -type f -name "*.js" -o -name "*.py" -o -name "*.ts" -o -name "*.java" 2>/dev/null | head -50
          echo "======================="

      - name: Collect Code Files
        id: collect
        run: |
          CONTEXT_FILE=/tmp/code_context.txt
          DEBUG_FILE=/tmp/debug_log.txt
          > "$CONTEXT_FILE"
          > "$DEBUG_FILE"

          COMMENT="${{ github.event.comment.body }}"
          echo "Original comment: $COMMENT" >> "$DEBUG_FILE"

          KEYWORDS=$(echo "$COMMENT" | tr '[:upper:]' '[:lower:]' | \
            sed 's/@[a-zA-Z0-9_-]*//g' | \
            sed 's/[^a-z0-9]/ /g' | \
            tr -s ' ' | \
            grep -oE '\b[a-z]{4,}\b' | sort -u | head -15)

          echo "Extracted keywords: $KEYWORDS" >> "$DEBUG_FILE"

          CODE_FILES=$(find . -type f \( \
            -name "*.js" -o -name "*.ts" -o -name "*.jsx" -o -name "*.tsx" \
            -o -name "*.py" -o -name "*.java" -o -name "*.go" -o -name "*.rb" \
            -o -name "*.php" -o -name "*.c" -o -name "*.cpp" -o -name "*.h" \
            \) ! -path "./.git/*" ! -path "./node_modules/*" ! -path "./vendor/*" 2>/dev/null)

          echo "Total code files found: $(echo "$CODE_FILES" | wc -l)" >> "$DEBUG_FILE"
          echo "All code files:" >> "$DEBUG_FILE"
          echo "$CODE_FILES" >> "$DEBUG_FILE"

          for FILE in $CODE_FILES; do
            if [ -f "$FILE" ]; then
              SCORE=0

              for KW in $KEYWORDS; do
                if echo "$FILE" | grep -qi "$KW"; then
                  SCORE=$((SCORE + 10))
                  echo "Matched keyword '$KW' in filename: $FILE" >> "$DEBUG_FILE"
                fi

                CONTENT_SAMPLE=$(head -300 "$FILE" 2>/dev/null | tr '[:upper:]' '[:lower:]')
                MATCHES=$(echo "$CONTENT_SAMPLE" | grep -oi "$KW" 2>/dev/null | wc -l)
                if [ "$MATCHES" -gt 0 ]; then
                  SCORE=$((SCORE + MATCHES))
                fi
              done

              echo "File: $FILE, Score: $SCORE" >> "$DEBUG_FILE"

              if [ "$SCORE" -gt 0 ]; then
                FILE_SIZE=$(wc -c < "$FILE" 2>/dev/null || echo 0)
                if [ "$FILE_SIZE" -lt 50000 ]; then
                  echo "--- START: $FILE (score=$SCORE, size=$FILE_SIZE bytes) ---" >> "$CONTEXT_FILE"
                  cat "$FILE" >> "$CONTEXT_FILE" 2>/dev/null || true
                  echo "--- END: $FILE ---" >> "$CONTEXT_FILE"
                  echo "" >> "$CONTEXT_FILE"
                else
                  echo "--- START: $FILE (truncated, size=$FILE_SIZE bytes) ---" >> "$CONTEXT_FILE"
                  head -400 "$FILE" >> "$CONTEXT_FILE" 2>/dev/null || true
                  echo "--- END: $FILE (truncated) ---" >> "$CONTEXT_FILE"
                  echo "" >> "$CONTEXT_FILE"
                fi
              fi
            fi
          done

          CONTEXT_BYTES=$(wc -c < "$CONTEXT_FILE" 2>/dev/null || echo 0)
          echo "Final context size: $CONTEXT_BYTES bytes" >> "$DEBUG_FILE"
          echo "bytes=$CONTEXT_BYTES" >> $GITHUB_OUTPUT

      - name: Show Collected Context Size
        run: |
          echo "Context bytes output: ${{ steps.collect.outputs.bytes }}"
          if [ "${{ steps.collect.outputs.bytes }}" -lt 100 ]; then
            echo "::warning::No code context collected!"
          fi

      - name: Build Prompt
        id: prompt
        run: |
          PROMPT_FILE=/tmp/prompt.txt
          > "$PROMPT_FILE"

          echo "You are an expert software engineer. You HAVE ACCESS TO THE ACTUAL CODEBASE." >> "$PROMPT_FILE"
          echo "Provide SPECIFIC fixes with exact file paths and line references." >> "$PROMPT_FILE"
          echo "" >> "$PROMPT_FILE"
          echo "FORMAT YOUR RESPONSE:" >> "$PROMPT_FILE"
          echo "1. Summarize the bug in 2-3 sentences" >> "$PROMPT_FILE"
          echo "2. Provide code blocks with FILE PATHS for each changed file" >> "$PROMPT_FILE"
          echo '   ```javascript src/App.jsx' >> "$PROMPT_FILE"
          echo "   // your code here" >> "$PROMPT_FILE"
          echo '   ```' >> "$PROMPT_FILE"
          echo "" >> "$PROMPT_FILE"
          echo "IMPORTANT: Do NOT write 'path=' in the code block. Just the file path." >> "$PROMPT_FILE"
          echo "BAD:  ```javascript path=./src/App.jsx" >> "$PROMPT_FILE"
          echo "GOOD: ```javascript src/App.jsx" >> "$PROMPT_FILE"
          echo "" >> "$PROMPT_FILE"
          echo "3. List all changed files under 'CHANGED FILES:'" >> "$PROMPT_FILE"
          echo "" >> "$PROMPT_FILE"
          echo "Repository: ${{ github.repository }}" >> "$PROMPT_FILE"
          echo "Issue: #${{ github.event.issue.number }}" >> "$PROMPT_FILE"
          echo "Title: ${{ github.event.issue.title }}" >> "$PROMPT_FILE"
          echo "" >> "$PROMPT_FILE"
          echo "USER REQUEST:" >> "$PROMPT_FILE"
          echo "${{ github.event.comment.body }}" >> "$PROMPT_FILE"
          echo "" >> "$PROMPT_FILE"

          CONTEXT_BYTES=${{ steps.collect.outputs.bytes }}
          if [ "$CONTEXT_BYTES" -gt 100 ]; then
            echo "ACTUAL CODEBASE (read from your repository):" >> "$PROMPT_FILE"
            cat /tmp/code_context.txt >> "$PROMPT_FILE"
          else
            echo "WARNING: No code context was collected from repository." >> "$PROMPT_FILE"
            echo "Please paste the relevant code files so I can analyze them." >> "$PROMPT_FILE"
          fi

          echo "file=/tmp/prompt.txt" >> $GITHUB_OUTPUT

      - name: Call DeepSeek API
        id: api
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          PROMPT_CONTENT=$(cat "${{ steps.prompt.outputs.file }}")
          REQUEST_FILE=/tmp/request.json
          jq -n --arg prompt "$PROMPT_CONTENT" '{
            model: "deepseek-v4-pro",
            messages: [
              {role: "system", content: "Expert coding assistant. Match Claude Sonnet 4.6 quality. You have access to actual code files."},
              {role: "user", content: $prompt}
            ],
            temperature: 0.2,
            max_tokens: 8000
          }' > "$REQUEST_FILE"
          RESPONSE=$(curl -sS -X POST https://api.deepseek.com/v1/chat/completions \
            -H "Authorization: Bearer $DEEPSEEK_KEY" \
            -H "Content-Type: application/json" \
            -d @"$REQUEST_FILE")
          CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          if [ ${#CONTENT} -gt 100 ]; then
            echo "$CONTENT" > /tmp/response.txt
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "Invalid response: $(echo "$RESPONSE" | jq -r '.error.message // "unknown"')"
            exit 1
          fi

      - name: Post Comment
        if: steps.api.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file /tmp/response.txt

      - name: Create Fix Branch
        if: steps.api.outputs.status == 'success'
        id: branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="deepseek-fix-${{ github.event.issue.number }}-$(date +%s)"
          echo "name=$BRANCH" >> $GITHUB_OUTPUT
          git config user.email "bot@deepseek.ai"
          git config user.name "DeepSeek Bot"
          git checkout -b "$BRANCH"

      - name: Apply Fixes
        if: steps.api.outputs.status == 'success'
        id: fixes
        run: |
          echo "=== Applying Fixes Debug ==="
          echo "Response file exists: $(test -f /tmp/response.txt && echo 'yes' || echo 'no')"
          echo "Response size: $(wc -c < /tmp/response.txt 2>/dev/null || echo '0') bytes"
          
          > /tmp/changed.txt
          
          # Show first 500 chars of response
          echo "=== First 500 chars of response ==="
          head -c 500 /tmp/response.txt
          echo ""
          
          # Extract code blocks with awk (fixed syntax - no >&2)
          awk '
          BEGIN { inblock = 0; outfile = ""; block_num = 0 }
          /^```/ {
            if (inblock) {
              close(outfile)
              inblock = 0
              outfile = ""
            } else {
              inblock = 1
              block_num++
              line = $0
              gsub(/^```[a-zA-Z]*[[:space:]]*/, "", line)
              gsub(/[[:space:]]*```$/, "", line)
              gsub(/[[:cntrl:]]/, "", line)
              filepath = line
              
              print "Block " block_num ": filepath=" filepath
              
              if ((index(filepath, "/") > 0 || substr(filepath, 1, 2) == "./") && match(filepath, /\.[a-z]+$/)) {
                gsub(/^\.\//, "", filepath)
                cmd = "mkdir -p $(dirname \"" filepath "\") 2>/dev/null"
                system(cmd)
                outfile = filepath
                print filepath >> "/tmp/changed.txt"
                print "Will write to: " filepath
              } else {
                print "Skipping (no valid path): " filepath
                outfile = "/dev/null"
              }
            }
            next
          }
          inblock && outfile != "/dev/null" && outfile != "" {
            print >> outfile
          }
          ' /tmp/response.txt
          
          echo "=== Extraction Results ==="
          if [ -s /tmp/changed.txt ]; then
            echo "Files to commit:"
            cat /tmp/changed.txt
          else
            echo "NO FILES EXTRACTED - Check response format"
          fi
          
          if [ -s /tmp/changed.txt ]; then
            while IFS= read -r FILE; do
              if [ -n "$FILE" ] && [ -f "$FILE" ]; then
                echo "Adding: $FILE"
                git add "$FILE"
              else
                echo "File not found: $FILE"
              fi
            done < /tmp/changed.txt
            
            if ! git diff --cached --quiet; then
              git commit -m "[DeepSeek] Auto-fix for issue ${{ github.event.issue.number }}"
              git push -u origin "${{ steps.branch.outputs.name }}"
              echo "applied=true" >> $GITHUB_OUTPUT
              echo "SUCCESS: Changes committed and pushed"
            else
              echo "No staged changes to commit"
            fi
          else
            echo "WARNING: No files extracted from response."
          fi

      - name: Create PR
        if: steps.fixes.outputs.applied == 'true'
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(gh pr create --title "[DeepSeek] Fix #${{ github.event.issue.number }}" --body "Auto-generated by @deepseek" --base "${{ github.event.repository.default_branch }}" --head "${{ steps.branch.outputs.name }}")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Notify PR
        if: steps.pr.outputs.url != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "✨ PR created: ${{ steps.pr.outputs.url }}"

      - name: Upload Debug Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.event.issue.number }}
          path: /tmp/debug_log.txt
          retention-days: 7
