<!-- Ottoman Empire: red field with white crescent and star -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40">
  <rect width="60" height="40" fill="#E30A17"/>
  <!-- Crescent: white circle minus offset red circle -->
  <circle cx="21" cy="20" r="10" fill="#fff"/>
  <circle cx="25.5" cy="20" r="8" fill="#E30A17"/>
  <!-- 5-pointed star centred at (38, 20), outer r=5, inner r=2 -->
  <polygon points="38,15 39.18,18.38 42.76,18.45 39.90,20.62 40.94,24.05 38,22 35.06,24.05 36.10,20.62 33.24,18.45 36.82,18.38" fill="#fff"/>
</svg>
